<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Tennis ball with a V monogram, matching the home-screen icon. Rounded
       corners are baked in here because favicons aren't masked by the OS. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123c2c"/>
      <stop offset="1" stop-color="#0a2e22"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="160" fill="#d9f86a"/>
  <g fill="none" stroke="#0a2e22" stroke-opacity=".18" stroke-width="14" stroke-linecap="round">
    <path d="M124 174C189 213 189 299 124 338"/>
    <path d="M388 174C323 213 323 299 388 338"/>
  </g>
  <path d="M198 190 256 330 314 190" fill="none" stroke="#0a2e22"
        stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
