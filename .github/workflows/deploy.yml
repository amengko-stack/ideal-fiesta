name: Deploy to Firebase Hosting

# Runs automatically when this branch (production) is pushed. Can also be
# triggered manually for any branch from the Actions tab ("Run workflow"),
# which is how a feature branch gets deployed before it's merged.
#
# Two jobs, so verifying and releasing are separate decisions:
#   verify — lint, tests and build run on every push, straight away.
#   deploy — ships exactly the dist/ that verify built, but only after the
#            `production` environment's required reviewer approves it.
# Before this split a push shipped the frontend the moment tests passed. On
# 2026-09-23 that put a new client live while the Cloud Functions it talks to
# were still the old build; Functions are deployed separately (from a laptop,
# `firebase deploy --only functions:…`), so the frontend has to be able to
# WAIT for them. Approve the pending deployment once the backend is live.
on:
  push:
    branches:
      - claude/general-assistance-jpgfB
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a full commit SHA (not a mutable tag like @v7)
      # so a compromised or re-tagged upstream release can't silently run
      # different code in this job — the deploy step below holds a real
      # credential. Version is noted in a comment for readability/updates.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A missing VITE_* secret does NOT fail the build — Vite quietly inlines
      # `undefined` and we'd ship an app that can't reach Firebase, green tick
      # and all. Fail here instead, naming what's absent, before spending a
      # build on it. Only booleans reach this step's environment, so no secret
      # value is exposed: the credential stays isolated to the deploy job.
      - name: Check required secrets
        env:
          HAS_SA:      ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
          HAS_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY != '' }}
          HAS_AUTH:    ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN != '' }}
          HAS_PROJECT: ${{ secrets.VITE_FIREBASE_PROJECT_ID != '' }}
          HAS_BUCKET:  ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET != '' }}
          HAS_SENDER:  ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID != '' }}
          HAS_APP_ID:  ${{ secrets.VITE_FIREBASE_APP_ID != '' }}
          HAS_VAPID:   ${{ secrets.VITE_FIREBASE_VAPID_KEY != '' }}
        run: |
          missing=""
          [ "$HAS_SA" = true ]      || missing="$missing FIREBASE_SERVICE_ACCOUNT"
          [ "$HAS_API_KEY" = true ] || missing="$missing VITE_FIREBASE_API_KEY"
          [ "$HAS_AUTH" = true ]    || missing="$missing VITE_FIREBASE_AUTH_DOMAIN"
          [ "$HAS_PROJECT" = true ] || missing="$missing VITE_FIREBASE_PROJECT_ID"
          [ "$HAS_BUCKET" = true ]  || missing="$missing VITE_FIREBASE_STORAGE_BUCKET"
          [ "$HAS_SENDER" = true ]  || missing="$missing VITE_FIREBASE_MESSAGING_SENDER_ID"
          [ "$HAS_APP_ID" = true ]  || missing="$missing VITE_FIREBASE_APP_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing — add them under Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "All required secrets are present."
          # VITE_FIREBASE_VAPID_KEY warns rather than fails: unlike the secrets
          # above, without it the app still reaches Firebase fine — the only
          # loss is push notifications staying unavailable. Not worth blocking
          # the whole Hosting deploy over an opt-in feature.
          [ "$HAS_VAPID" = true ] || echo "::warning::VITE_FIREBASE_VAPID_KEY is not set — push notifications will be unavailable in this build."

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (informational — pre-existing issues don't block deploy)
        run: npm run lint
        continue-on-error: true

      - name: Run tests
        run: npm test

      # These VITE_FIREBASE_* values are Firebase's public client config —
      # already embedded in the shipped JS bundle for every site visitor,
      # so they carry no secrecy value. Security is enforced by Firestore
      # rules, not by hiding this config. The real credential below
      # (FIREBASE_SERVICE_ACCOUNT) is kept out of this job entirely, isolated
      # to the one action in the deploy job that needs it.
      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}

      # The deploy job ships this exact build — it does not rebuild, so what
      # was tested is what goes live.
      - name: Keep the build for the deploy job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    # Required reviewer is configured on this environment (repo Settings →
    # Environments → production). The job waits here until approved.
    environment:
      name: production
      url: https://athlete-os-15c3b.web.app
    # One production release at a time. On the deploy job only, so a later
    # push's verify job never queues behind a deploy awaiting approval; a
    # newer pending deploy supersedes an older one still waiting, and one
    # already running is never cancelled half-way.
    concurrency:
      group: hosting-production
      cancel-in-progress: false
    steps:
      # firebase.json (hosting config, rewrites, headers) comes from the repo.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the verified build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Deploy to Firebase Hosting (live)
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: athlete-os-15c3b
          channelId: live
