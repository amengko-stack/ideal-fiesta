name: Deploy to Firebase Hosting

# Runs automatically when this branch (production) is pushed. Can also be
# triggered manually for any branch from the Actions tab ("Run workflow"),
# which is how a feature branch gets deployed before it's merged.
on:
  push:
    branches:
      - claude/general-assistance-jpgfB
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a full commit SHA (not a mutable tag like @v7)
      # so a compromised or re-tagged upstream release can't silently run
      # different code in this job — the deploy step below holds a real
      # credential. Version is noted in a comment for readability/updates.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (informational — pre-existing issues don't block deploy)
        run: npm run lint
        continue-on-error: true

      - name: Run tests
        run: npm test

      # These VITE_FIREBASE_* values are Firebase's public client config —
      # already embedded in the shipped JS bundle for every site visitor,
      # so they carry no secrecy value. Security is enforced by Firestore
      # rules, not by hiding this config. The real credential below
      # (FIREBASE_SERVICE_ACCOUNT) is kept out of this and every earlier
      # step's environment, isolated to the one action that needs it.
      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Deploy to Firebase Hosting (live)
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: athlete-os-15c3b
          channelId: live
